openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: EcoQuest API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and stats
  - name: activities
    description: Carbon activities
  - name: challenges
    description: Daily eco challenges
  - name: recommendations
    description: AI recommendations
  - name: leaderboard
    description: Leaderboard rankings
  - name: dashboard
    description: Dashboard summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found
    put:
      operationId: upsertProfile
      tags: [users]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/onboarding:
    post:
      operationId: submitOnboarding
      tags: [users]
      summary: Submit onboarding questionnaire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingData"
      responses:
        "200":
          description: Onboarding complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /activities:
    get:
      operationId: getActivities
      tags: [activities]
      summary: Get user activities
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: logActivity
      tags: [activities]
      summary: Log a carbon activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /activities/calculator:
    post:
      operationId: calculateFootprint
      tags: [activities]
      summary: Calculate carbon footprint from questionnaire data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FootprintCalculation"
      responses:
        "200":
          description: Footprint result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FootprintResult"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary with stats, charts, badges
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /challenges:
    get:
      operationId: getChallenges
      tags: [challenges]
      summary: Get today's challenges for the user
      responses:
        "200":
          description: Challenges list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Challenge"

  /challenges/{id}/complete:
    post:
      operationId: completeChallenge
      tags: [challenges]
      summary: Mark a challenge as completed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Challenge completed, points awarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResult"

  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Get personalized eco recommendations with completion status
      responses:
        "200":
          description: Recommendations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"

  /recommendations/{id}/complete:
    post:
      operationId: completeRecommendation
      tags: [recommendations]
      summary: Mark a recommendation as done (resets after 24h)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Marked successfully
          content:
            application/json:
              schema:
                type: object
                required: [recommendationId, completedUntil]
                properties:
                  recommendationId: { type: integer }
                  completedUntil: { type: string, format: date-time }

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get leaderboard rankings
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [global, weekly]
            default: global
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /leaderboard/me:
    get:
      operationId: getMyRank
      tags: [leaderboard]
      summary: Get current user's leaderboard rank
      responses:
        "200":
          description: Current user rank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRank"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    UserProfile:
      type: object
      required: [id, clerkId, name, email, carbonScore, greenPoints, streak, badges, onboardingComplete, createdAt]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        name: { type: string }
        email: { type: string }
        profileImage: { type: ["string", "null"] }
        carbonScore: { type: number }
        greenPoints: { type: integer }
        streak: { type: integer }
        badges: { type: array, items: { type: string } }
        onboardingComplete: { type: boolean }
        country: { type: ["string", "null"] }
        ageGroup: { type: ["string", "null"] }
        transportation: { type: ["string", "null"] }
        dailyTravelKm: { type: ["number", "null"] }
        electricityBill: { type: ["number", "null"] }
        householdSize: { type: ["integer", "null"] }
        foodPreference: { type: ["string", "null"] }
        shoppingFrequency: { type: ["string", "null"] }
        airTravelPerYear: { type: ["integer", "null"] }
        recyclingHabits: { type: ["string", "null"] }
        createdAt: { type: string }

    UserProfileInput:
      type: object
      properties:
        name: { type: string }
        profileImage: { type: string }

    OnboardingData:
      type: object
      required: [country, ageGroup, transportation, dailyTravelKm, electricityBill, householdSize, foodPreference, shoppingFrequency, airTravelPerYear, recyclingHabits]
      properties:
        country: { type: string }
        ageGroup: { type: string }
        transportation: { type: string }
        dailyTravelKm: { type: number }
        electricityBill: { type: number }
        householdSize: { type: integer }
        foodPreference: { type: string }
        shoppingFrequency: { type: string }
        airTravelPerYear: { type: integer }
        recyclingHabits: { type: string }

    Activity:
      type: object
      required: [id, userId, category, emissionKg, description, date, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        category: { type: string }
        emissionKg: { type: number }
        description: { type: string }
        date: { type: string }
        createdAt: { type: string }

    ActivityInput:
      type: object
      required: [category, emissionKg, description, date]
      properties:
        category: { type: string }
        emissionKg: { type: number }
        description: { type: string }
        date: { type: string }

    FootprintCalculation:
      type: object
      required: [transportation, dailyTravelKm, electricityBill, householdSize, foodPreference, shoppingFrequency, airTravelPerYear]
      properties:
        transportation: { type: string }
        dailyTravelKm: { type: number }
        electricityBill: { type: number }
        householdSize: { type: integer }
        foodPreference: { type: string }
        shoppingFrequency: { type: string }
        airTravelPerYear: { type: integer }

    FootprintResult:
      type: object
      required: [dailyKg, monthlyKg, annualKg, impactLevel, breakdown, comparisons]
      properties:
        dailyKg: { type: number }
        monthlyKg: { type: number }
        annualKg: { type: number }
        impactLevel: { type: string, enum: [low, moderate, high] }
        breakdown:
          type: object
          required: [transportation, electricity, food, shopping, lifestyle]
          properties:
            transportation: { type: number }
            electricity: { type: number }
            food: { type: number }
            shopping: { type: number }
            lifestyle: { type: number }
        comparisons:
          type: object
          required: [treesNeeded, carKm, householdDays]
          properties:
            treesNeeded: { type: number }
            carKm: { type: number }
            householdDays: { type: number }

    DashboardSummary:
      type: object
      required: [carbonScore, greenPoints, streak, badges, weeklyEmissions, monthlyEmissions, categoryBreakdown, recentActivities, completedChallenges]
      properties:
        carbonScore: { type: number }
        greenPoints: { type: integer }
        streak: { type: integer }
        badges: { type: array, items: { type: string } }
        weeklyEmissions:
          type: array
          items:
            type: object
            required: [day, kg]
            properties:
              day: { type: string }
              kg: { type: number }
        monthlyEmissions:
          type: array
          items:
            type: object
            required: [month, kg]
            properties:
              month: { type: string }
              kg: { type: number }
        categoryBreakdown:
          type: array
          items:
            type: object
            required: [category, kg, percentage]
            properties:
              category: { type: string }
              kg: { type: number }
              percentage: { type: number }
        recentActivities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        completedChallenges: { type: integer }

    Challenge:
      type: object
      required: [id, title, description, points, difficulty, category, completed, completedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        points: { type: integer }
        difficulty: { type: string, enum: [easy, medium, hard] }
        category: { type: string }
        completed: { type: boolean }
        completedAt: { type: ["string", "null"] }

    ChallengeResult:
      type: object
      required: [challenge, pointsEarned, newTotal, newStreak, newBadges]
      properties:
        challenge:
          $ref: "#/components/schemas/Challenge"
        pointsEarned: { type: integer }
        newTotal: { type: integer }
        newStreak: { type: integer }
        newBadges: { type: array, items: { type: string } }

    Recommendation:
      type: object
      required: [id, title, description, carbonSavingKg, moneySavingMonthly, difficulty, category, icon]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        carbonSavingKg: { type: number }
        moneySavingMonthly: { type: number }
        difficulty: { type: string, enum: [easy, medium, hard] }
        category: { type: string }
        icon: { type: string }
        completedUntil: { type: string, format: date-time, nullable: true }

    LeaderboardEntry:
      type: object
      required: [rank, userId, name, greenPoints, carbonScore, streak, badges, completedChallenges]
      properties:
        rank: { type: integer }
        userId: { type: integer }
        name: { type: string }
        profileImage: { type: ["string", "null"] }
        greenPoints: { type: integer }
        carbonScore: { type: number }
        streak: { type: integer }
        badges: { type: array, items: { type: string } }
        completedChallenges: { type: integer }

    MyRank:
      type: object
      required: [rank, totalUsers, percentile, greenPoints, carbonScore]
      properties:
        rank: { type: integer }
        totalUsers: { type: integer }
        percentile: { type: number }
        greenPoints: { type: integer }
        carbonScore: { type: number }
